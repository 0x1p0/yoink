name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish release
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE27=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | head -1 || true)
          if [ -n "$XCODE27" ]; then
            sudo xcode-select -s "$XCODE27"
          fi
          xcodebuild -version

      - name: Fetch bundled binaries
        run: bash ./download_binaries.sh

      - name: Build (Release)
        run: |
          xcodebuild -project Yoink.xcodeproj -scheme Yoink -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual CODE_SIGNING_REQUIRED=NO \
            build

      - name: Ad-hoc sign
        run: |
          APP="build/Build/Products/Release/Yoink.app"
          test -d "$APP"
          codesign --force --deep --sign - \
            --entitlements Yoink/Yoink.entitlements \
            "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Package DMG
        run: |
          VERSION="1.0.${{ github.run_number }}"
          APP="build/Build/Products/Release/Yoink.app"
          STAGING="$(mktemp -d)"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Yoink $VERSION" -srcfolder "$STAGING" \
            -ov -format UDZO "Yoink-$VERSION.dmg"
          ls -lh "Yoink-$VERSION.dmg"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Yoink v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: Yoink-*.dmg
          fail_on_unmatched_files: true
